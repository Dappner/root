name: Lint & Type Check

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm typecheck

  go-migrator:
    name: Go Migration Runner Build & Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: go-api/go.sum

      - name: Build
        run: go build ./...

      - name: Run go vet
        run: go vet ./...

  fast-api-lint:
    name: Fast-Api Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fast-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: fast-api/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck
