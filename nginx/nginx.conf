user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    map $request_uri $is_playback_progress_poll {
        default                                      0;
        ~^/rag-api/playback/sources/[0-9]+/progress  1;
    }

    map "$is_playback_progress_poll:$status" $loggable {
        default  1;
        ~^1:[23] 0;
    }

    access_log /dev/stdout main if=$loggable;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting zones
    include /etc/nginx/rate-limit.conf;

    # Upstream servers
    upstream fast-api {
        zone fast-api 64k;
        server fast-api:8081 resolve;
    }

    upstream auth-server {
        zone auth-server 64k;
        server auth-server:8082 resolve;
    }

    server {
        listen 80;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-Proxy "nginx" always;
        add_header X-Config-Rev "nginx-2026-06-12-01" always;

        # Root endpoint for sanity checks
        location = / {
            access_log off;
            return 200 "nginx ok\n";
            add_header Content-Type text/plain;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Better-Auth endpoints - /api/auth/* -> dedicated auth-server (Hono/Bun)
        location /api/auth/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://auth-server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Auth responses set cookies; never buffer or cache them.
            proxy_buffering off;
            proxy_cache off;
        }

        # Python RAG API endpoints - /rag-api/*
        location /rag-api/ {
            # Apply rate limiting (stricter due to expensive AI operations)
            limit_req zone=rag_limit burst=10 nodelay;
            limit_req_status 429;

            client_max_body_size 50m;

            proxy_pass http://fast-api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Longer timeouts for AI operations
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;

            # SSE support for streaming responses
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
