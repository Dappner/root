# Rate limiting configuration for NGINX

# Define rate limiting zones
# API endpoints - 10 requests per second per IP, with burst capacity
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# RAG API endpoints - 5 requests per second per IP (AI operations are more expensive)
limit_req_zone $binary_remote_addr zone=rag_limit:10m rate=5r/s;

# Connection limits - max 10 connections per IP
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_conn addr 10;
