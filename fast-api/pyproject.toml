[project]
name = "root-fast-api"
version = "0.1.0"
description = "FastAPI RAG and external integration service for Root."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiocache==0.12.3",
    "assemblyai==0.50.0",
    "asyncpg==0.31.0",
    "boto3==1.42.44",
    "certifi==2026.1.4",
    "defusedxml==0.7.1",
    "fastapi==0.128.3",
    "httpx==0.28.1",
    "jetflow[all]==1.0.90",
    "logfire[fastapi,httpx,sqlalchemy,system-metrics]==4.22.0",
    "openai==2.17.0",
    "pgvector==0.4.2",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "pyjwt[crypto]==2.11.0",
    "pypdf>=6.19.0",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.22",
    "sqlalchemy[asyncio]==2.0.46",
    "sse-starlette==3.2.0",
    "uvicorn[standard]==0.40.0",
    "voyageai==0.3.7",
    "youtube-transcript-api==1.2.4",
]

[dependency-groups]
dev = [
    "black==26.1.0",
    "mypy==1.19.1",
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: test requires the Postgres test database (auto-applied to tests using the `db`/`client` fixtures)",
]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
strict_equality = true
